version: 0.2

env:
  variables:
    # Mirrors E2E_ACCOUNT_ID in IntegrationTestBase, which refuses to run anywhere else
    E2E_ACCOUNT_ID: "282305091481"

phases:
  install:
    runtime-versions:
      java: corretto21
      nodejs: 24
    commands:
      - npm ci --ignore-scripts --no-audit --no-fund
      - npm run allure:version

  build:
    commands:
      # The suite refuses to run outside the e2e account, and the `|| true` below would report that
      # refusal as a successful build with an empty report. Fail the build here instead, so a
      # misconfigured role is visible rather than silent.
      - |
        ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
        if [ "$ACCOUNT_ID" != "$E2E_ACCOUNT_ID" ]; then
          echo "Refusing to run: this build is in account $ACCOUNT_ID, not the e2e account $E2E_ACCOUNT_ID"
          exit 1
        fi
      # Test failures must not stop the report from being generated and published below
      - ./gradlew test || true
  post_build:
    commands:
      - aws s3 cp s3://$TESTREPORTS_BUCKET/allure-history.jsonl allure-history.jsonl || true
      - npm run allure:generate
      - aws s3 cp allure-history.jsonl s3://$TESTREPORTS_BUCKET/allure-history.jsonl
      - aws s3 cp allure-report/index.html s3://$TESTREPORTS_BUCKET/reports/$(date +%Y-%m-%d).html
      - aws s3 cp allure-report s3://$TESTREPORTS_BUCKET --recursive
